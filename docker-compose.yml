services:
  unirun:
    build: .
    image: unirun-web:local
    container_name: unirun-web
    init: true
    restart: unless-stopped
    # 局域网直连：绑定所有网卡的 8000 端口。
    # 不要把该端口直接映射到公网；公网请改回 127.0.0.1 并套 HTTPS 反向代理。
    ports:
      - "8000:8000"
    environment:
      SESSION_IDLE_TTL: "900"
      SESSION_MAX_TTL: "7200"
      COOKIE_SECURE: "0"
      # 建议放到 .env（已被 .gitignore 忽略），不要提交真实值
      ACCESS_CODE: "${ACCESS_CODE:-}"
      # 逗号/空格分隔的授权手机号；留空表示不启用白名单
      ALLOWED_PHONES: "${ALLOWED_PHONES:-}"
      LOGIN_MAX_ATTEMPTS: "10"
      LOGIN_WINDOW_SECONDS: "300"
      UPSTREAM_TIMEOUT: "20"
      APP_TIMEZONE: "Asia/Shanghai"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
